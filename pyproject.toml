[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yggdrasil-memory"
version = "0.18.0"
description = "One shared, durable memory for all your AI coding agents — MCP, local-first, zero-dependency."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Yggdrasil contributors" }]
keywords = ["mcp", "memory", "ai-agents", "claude", "codex", "local-first", "obsidian", "rag"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Environment :: Console",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/VonderVuflya/yggdrasil"
Repository = "https://github.com/VonderVuflya/yggdrasil"
Issues = "https://github.com/VonderVuflya/yggdrasil/issues"

[project.scripts]
ygg = "yggdrasil.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["yggdrasil"]

[tool.hatch.build.targets.sdist]
include = [
  "/yggdrasil", "/web", "/scripts", "/tests", "/eval", "/docs", "/i18n",
  "/clients/npm", "/packaging/mcpb", "/server.json",
  "/.claude-plugin", "/.codex-plugin", "/.cursor-plugin",
  "/README.md", "/LICENSE", "/CHANGELOG.md",
]
